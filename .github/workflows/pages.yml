# Publishes the browser build (make wasm) on GitHub Pages. The model is
# too large for git: it comes from a release of indecis-ner.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MODEL_RELEASE: v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download the model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$MODEL_RELEASE" --repo Bornholm/indecis-ner --dir model
      - run: make wasm MODEL=model
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
